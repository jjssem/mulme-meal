<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>물메초 오늘</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf8ef; --card:#ffffff; --ink:#2b2a27; --muted:#7a756b;
    --accent:#e8743b; --accent2:#3b8f6b; --line:#efe6d6; --chip:#fff1e3;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1d1c1a; --card:#2a2826; --ink:#f2eee6; --muted:#a8a194;
      --accent:#f08a54; --accent2:#5cb38c; --line:#3a3733; --chip:#3a2e24; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Gowun Dodum",system-ui,sans-serif;min-height:100vh}
  .wrap{max-width:880px;margin:0 auto;padding:28px 16px 40px}
  header{text-align:center;margin-bottom:22px}
  h1{font-family:"Jua",sans-serif;font-size:clamp(28px,6vw,42px);margin:0;letter-spacing:-.5px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);margin-top:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px 22px;
    box-shadow:0 6px 0 var(--line)}
  .card h2{font-family:"Jua",sans-serif;font-weight:400;font-size:24px;margin:0;display:flex;align-items:baseline;gap:8px}
  .badge{font-size:14px;background:var(--accent);color:#fff;border-radius:99px;padding:2px 10px}
  .card.tmr .badge{background:var(--accent2)}
  .date{color:var(--muted);font-size:15px;margin:4px 0 14px}
  ul{list-style:none;margin:0;padding:0}
  li{padding:9px 0;border-bottom:1px dashed var(--line);font-size:20px;display:flex;justify-content:space-between;gap:8px}
  li:last-child{border-bottom:0}
  .alg{font-size:12px;color:var(--muted);white-space:nowrap;align-self:center}
  .kcal{margin-top:12px;font-size:14px;color:var(--muted)}
  .empty{padding:18px 0;color:var(--muted);font-size:18px;text-align:center}
  .next{margin-top:10px;background:var(--chip);border-radius:14px;padding:12px 14px;font-size:15px}
  .next b{font-family:"Jua",sans-serif;font-weight:400}
  .err{background:#fde8e8;color:#8a1f1f;border-radius:14px;padding:14px;margin-top:16px;display:none}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}
  button{font:inherit;border:0;background:none;color:var(--accent);cursor:pointer;text-decoration:underline}

  /* 날씨 카드 */
  .wx{margin-bottom:16px;display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:center}
  .wx .big{display:flex;align-items:center;gap:10px}
  .wx .icon{font-size:56px;line-height:1}
  .wx .temp{font-family:"Jua",sans-serif;font-size:48px;line-height:1}
  .wx .temp small{font-size:18px;color:var(--muted);font-family:"Gowun Dodum",sans-serif;display:block;margin-top:4px}
  .wx .facts{display:flex;flex-wrap:wrap;gap:8px}
  .pill{background:var(--chip);border-radius:12px;padding:8px 12px;font-size:16px;line-height:1.3}
  .pill b{font-family:"Jua",sans-serif;font-weight:400;font-size:19px}
  .g1{background:#dceefe;color:#0b4f8a} .g2{background:#dff3e4;color:#1d6b39}
  .g3{background:#ffe9c7;color:#8a4b00} .g4{background:#fbd5d5;color:#8a1f1f}
  .signal{grid-column:1/-1;border-radius:16px;padding:12px 16px;font-size:20px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
  .signal b{font-family:"Jua",sans-serif;font-weight:400;font-size:24px}
  .signal.ok{background:#dff3e4;color:#1d6b39} .signal.caution{background:#ffe9c7;color:#8a4b00} .signal.no{background:#fbd5d5;color:#8a1f1f}
  .signal .why{font-size:16px}
  .wx .src{grid-column:1/-1;font-size:12px;color:var(--muted)}
  @media (max-width:520px){ .wx{grid-template-columns:1fr} }

  /* 낮은 가로 화면(1024×768 태블릿·모니터 등)에서는 한 화면에 들어오도록 촘촘하게 */
  @media (min-width:700px) and (max-height:860px){
    .wrap{padding:10px 16px 8px;max-width:980px}
    header{margin-bottom:8px;display:flex;justify-content:center;align-items:baseline;gap:12px}
    h1{font-size:30px}
    .sub{margin-top:0;font-size:14px}
    .card{padding:12px 18px;border-radius:18px;box-shadow:0 4px 0 var(--line)}
    .wx{margin-bottom:10px;gap:6px 18px}
    .wx .icon{font-size:42px}
    .wx .temp{font-size:38px}
    .wx .temp small{font-size:15px;margin-top:2px}
    .pill{padding:6px 10px;font-size:14px}
    .pill b{font-size:17px}
    .signal{padding:7px 14px;font-size:17px}
    .signal b{font-size:20px}
    .signal .why{font-size:15px}
    .grid{gap:12px}
    .card h2{font-size:21px}
    .date{margin:2px 0 6px;font-size:14px}
    li{padding:5px 0;font-size:18px}
    .kcal{margin-top:6px;font-size:13px}
    .empty{padding:10px 0}
    .next{margin-top:6px;padding:8px 12px}
    footer{margin-top:8px;font-size:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏫 물메초 <span>오늘</span></h1>
    <div class="sub" id="sub">급식 정보를 불러오는 중…</div>
  </header>

  <section class="card wx" id="weather"><div class="empty" style="grid-column:1/-1">날씨 불러오는 중…</div></section>

  <div class="grid">
    <section class="card" id="today"><h2>오늘 <span class="badge">TODAY</span></h2><div class="date"></div><div class="body"><div class="empty">불러오는 중…</div></div></section>
    <section class="card tmr" id="tomorrow"><h2>내일 <span class="badge">TOMORROW</span></h2><div class="date"></div><div class="body"><div class="empty">불러오는 중…</div></div></section>
  </div>

  <div class="err" id="err"></div>
  <footer>자료: 나이스 교육정보 개방 포털 · 기상청 · 에어코리아 · <button id="reload">새로고침</button></footer>
</div>

<script>
const ALLERGY = ["","난류","우유","메밀","땅콩","대두","밀","고등어","게","새우","돼지고기","복숭아","토마토","아황산류","호두","닭고기","쇠고기","오징어","조개류","잣"];
const WEEK = ["일","월","화","수","목","금","토"];

const ymd = d => d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
const kDate = d => `${d.getMonth()+1}월 ${d.getDate()}일 (${WEEK[d.getDay()]})`;
const parseYmd = s => new Date(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8));

// 인증키는 Netlify Function(/api/meal)이 서버에서 붙여서 호출합니다.
async function fetchMeals(from, to){
  const res = await fetch(`/api/meal?from=${from}&to=${to}`);
  let data = {};
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error(data.error || ("서버 오류 (" + res.status + ")"));
  return data.meals || [];
}

// "카레라이스 (1.2.5.6)<br/>배추김치 (9)" → [{name, allergy:[...]}]
function parseDishes(raw){
  return raw.split(/<br\s*\/?>/i).map(s => s.trim()).filter(Boolean).map(s => {
    const m = s.match(/\(([\d.\s]+)\)\s*$/);
    const nums = m ? m[1].split(".").map(n=>+n).filter(n=>n>0 && n<ALLERGY.length) : [];
    const name = s.replace(/\(([\d.\s]+)\)\s*$/,"").replace(/[*#@]+$/,"").trim();
    return {name, allergy: nums.map(n=>ALLERGY[n])};
  });
}

function renderMeal(el, date, meal, nextMeal){
  el.querySelector(".date").textContent = kDate(date);
  const body = el.querySelector(".body");
  if (!meal){
    const weekend = date.getDay()===0 || date.getDay()===6;
    let html = `<div class="empty">${weekend ? "쉬는 날이에요 😴" : "급식이 없어요"}</div>`;
    if (nextMeal){
      const d = parseYmd(nextMeal.date);
      const names = parseDishes(nextMeal.dishes).map(x=>x.name).join(", ");
      html += `<div class="next"><b>다음 급식 · ${kDate(d)}</b><br>${names}</div>`;
    }
    body.innerHTML = html;
    return;
  }
  const dishes = parseDishes(meal.dishes);
  body.innerHTML = "<ul>" + dishes.map(d =>
    `<li><span>${d.name}</span>${d.allergy.length?`<span class="alg" title="알레르기 유발 식품">${d.allergy.join("·")}</span>`:""}</li>`
  ).join("") + "</ul>" + (meal.kcal ? `<div class="kcal">🔥 ${meal.kcal}</div>` : "");
}

async function load(){
  const err = document.getElementById("err"); err.style.display="none";
  const today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
  const until = new Date(today); until.setDate(today.getDate()+14);
  try{
    const rows = await fetchMeals(ymd(today), ymd(until));
    const byDay = Object.fromEntries(rows.map(r=>[r.date, r]));
    const next = rows.find(r => r.date > ymd(tomorrow));
    renderMeal(document.getElementById("today"), today, byDay[ymd(today)], next);
    renderMeal(document.getElementById("tomorrow"), tomorrow, byDay[ymd(tomorrow)], next);
    document.getElementById("sub").textContent = "제주 물메초등학교 · 점심 메뉴";
  }catch(e){
    document.getElementById("sub").textContent = "급식 정보를 불러오지 못했어요";
    err.textContent = "⚠️ " + e.message + " — 인터넷 연결을 확인하거나 잠시 후 새로고침해 주세요.";
    err.style.display="block";
    document.querySelectorAll(".card .body").forEach(b=>b.innerHTML='<div class="empty">—</div>');
  }
}

/* ===== 날씨·미세먼지 ============================================ */
const GRADE = ["", "좋음", "보통", "나쁨", "매우나쁨"];
const SIGNAL = { ok: "⭕ 운동장 활동 좋아요", caution: "⚠️ 운동장 활동 주의", no: "❌ 실내 활동 권장" };

function wxIcon(now, today){
  const pty = now?.pty || today?.pty || 0;
  if (pty === 3 || pty === 7) return "❄️";
  if (pty === 2 || pty === 6) return "🌨️";
  if (pty > 0) return "🌧️";
  const h = new Date().getHours();
  if (today?.sky === 4) return "☁️";
  if (today?.sky === 3) return "⛅";
  return (h >= 18 || h < 6) ? "🌙" : "☀️";
}

function renderWeather(w){
  const el = document.getElementById("weather");
  const { now, today, air, outdoor } = w;
  const temp = now?.temp ?? null;
  const pills = [];
  if (today?.tmn != null || today?.tmx != null)
    pills.push(`<div class="pill">최저/최고<br><b>${today.tmn ?? "-"}° / ${today.tmx ?? "-"}°</b></div>`);
  if (today) pills.push(`<div class="pill">강수확률<br><b>${today.popMax}%</b></div>`);
  if (air?.pm10 != null) pills.push(`<div class="pill g${air.grade10}">미세먼지<br><b>${GRADE[air.grade10]}</b> ${air.pm10}</div>`);
  if (air?.pm25 != null) pills.push(`<div class="pill g${air.grade25}">초미세먼지<br><b>${GRADE[air.grade25]}</b> ${air.pm25}</div>`);
  if (outdoor?.umbrella) pills.push(`<div class="pill">☂️<br><b>우산 챙기기</b></div>`);

  const src = [now ? `기상청 ${now.time} 관측` : "", air ? `에어코리아 ${air.station} 측정소` : "",
    w.errors && Object.keys(w.errors).length ? "일부 정보를 못 불러왔어요" : ""].filter(Boolean).join(" · ");

  el.innerHTML = `
    <div class="big"><div class="icon">${wxIcon(now, today)}</div>
      <div class="temp">${temp != null ? temp + "°" : "-"}<small>지금 기온${now?.humidity != null ? " · 습도 " + now.humidity + "%" : ""}</small></div></div>
    <div class="facts">${pills.join("")}</div>
    ${outdoor ? `<div class="signal ${outdoor.level}"><b>${SIGNAL[outdoor.level]}</b>${outdoor.reasons.length ? `<span class="why">${outdoor.reasons.join(" · ")}</span>` : ""}</div>` : ""}
    <div class="src">${src}</div>`;
}

let lastWx = 0;
async function loadWeather(){
  lastWx = Date.now();
  try{
    const res = await fetch("/api/weather");
    let data = {}; try{ data = await res.json(); }catch(e){}
    if (!res.ok) throw new Error(data.error || ("서버 오류 (" + res.status + ")"));
    renderWeather(data);
  }catch(e){
    document.getElementById("weather").innerHTML =
      `<div class="empty" style="grid-column:1/-1">날씨 정보를 불러오지 못했어요<br><small>${e.message}</small></div>`;
  }
}
const WX_REFRESH_MS = 60 * 60 * 1000;   // 날씨는 1시간마다 (관측·측정 자료가 1시간 단위로 바뀜)
setInterval(loadWeather, WX_REFRESH_MS);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - lastWx > WX_REFRESH_MS) loadWeather();
});
loadWeather();

document.getElementById("reload").onclick = () => { load(); loadWeather(); };

/* ===== 자동 갱신 ================================================
   - 매일 자정(00:01)에 한 번 → '오늘/내일'이 하루씩 넘어감
   - 낮 동안 혹시 메뉴가 고쳐질 경우를 대비해 3시간마다 한 번
   - 태블릿이 절전에서 깨어났을 때, 날짜가 바뀌었거나 3시간이 지났으면 한 번
================================================================ */
const REFRESH_MS = 3 * 60 * 60 * 1000;   // 3시간
let lastLoad = 0, lastDay = "";
const _load = load;
load = async () => { lastLoad = Date.now(); lastDay = ymd(new Date()); await _load(); };

function scheduleMidnight(){
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 1);
  setTimeout(() => { load(); scheduleMidnight(); }, next - now);
}
scheduleMidnight();
setInterval(() => load(), REFRESH_MS);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && (ymd(new Date()) !== lastDay || Date.now() - lastLoad > REFRESH_MS)) load();
});

/* ===== 화면 켜짐 유지 시간 ========================================
   평일 08:30 ~ 15:00 에만 화면이 꺼지지 않게 붙잡아 둡니다.
   그 밖의 시간(주말 포함)에는 붙잡지 않으므로, 태블릿의
   '화면 자동 꺼짐' 설정 시간이 지나면 화면이 저절로 꺼집니다.
================================================================ */
const AWAKE = { start: "08:30", end: "15:00", weekdaysOnly: true };
let wakeLock = null;

function inAwakeHours(d = new Date()){
  if (AWAKE.weekdaysOnly && (d.getDay() === 0 || d.getDay() === 6)) return false;
  const hm = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  return hm >= AWAKE.start && hm < AWAKE.end;
}

async function updateWakeLock(){
  if (!("wakeLock" in navigator)) return;            // 지원하지 않는 브라우저면 아무것도 안 함
  try{
    if (inAwakeHours() && !document.hidden){
      if (!wakeLock){
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } else if (wakeLock){
      await wakeLock.release(); wakeLock = null;
    }
  }catch(e){ wakeLock = null; }
}

updateWakeLock();
setInterval(updateWakeLock, 60 * 1000);              // 1분마다 시간대만 확인 (서버 호출 없음)
document.addEventListener("visibilitychange", updateWakeLock);
document.addEventListener("click", updateWakeLock); // 일부 브라우저는 화면을 한 번 터치해야 허용됨

load();
</script>
</body>
</html>
